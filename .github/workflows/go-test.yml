name: Go Test
on:
  workflow_call:
    secrets:
      GH_GO_MODULES_APP_ID:
        required: false
      GH_GO_MODULES_APP_PRIVATE_KEY:
        required: false
    inputs:
      setup-internal-go:
        description: Whether to setup access for internal Go modules. Can only be used by private repositories.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: microbiotica/github/.github/actions/setup-go@main
        if: inputs.setup-internal-go == 'true'
        with:
          app-id: ${{ secrets.GH_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.GH_GO_MODULES_APP_PRIVATE_KEY }}

      - name: go test
        run: go run gotest.tools/gotestsum@latest --junitfile report.xml --format testname -- -race ./...

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: report.xml
          check_name: Test Report
          comment: true
          detailed_summary: true
          annotate_only: true